<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDU-SSH · SSH Lab</title>
<meta name="description" content="Imparare SSH con due macchine vere affiancate nel browser: chiavi pubbliche e private, ssh-agent, impronte SHA256. Nessuna installazione, nessun account.">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='5' fill='%2306141a'/><text x='4' y='23' font-family='monospace' font-size='17' fill='%235ad7e6'>&gt;_</text><circle cx='26' cy='9' r='4' fill='%23e3b341'/></svg>">
</head>
<body>

<header class="barra">
  <div class="marchio">
    <span class="sigla">EDU-SSH</span>
    <span class="nome" data-i18n="titolo">SSH Lab</span>
    <span class="claim" data-i18n="sottotitolo"></span>
  </div>
  <nav class="azioni">
    <button id="btnIndice" class="btn" data-i18n="navIndice"></button>
    <button id="btnIntro"  class="btn" data-i18n="navIntro"></button>
    <div class="switch" id="switchDepth" data-i18n-title="depthTitle">
      <button data-depth="base" class="on" data-i18n="depthBase"></button>
      <button data-depth="pro"  data-i18n="depthPro"></button>
    </div>
    <div class="switch" id="switchLang">
      <button data-lang="it">IT</button>
      <button data-lang="en">EN</button>
    </div>
  </nav>
</header>

<div class="progresso"><div id="barraProgresso"></div></div>

<main id="impaginato">
  <article id="capitolo" class="capitolo"></article>

  <aside id="pannelloLab" class="lab">
    <div class="lab-testa">
      <span class="lab-titolo" data-i18n="labTitolo"></span>
      <span id="labStato" class="lab-stato"></span>
      <span class="spazio"></span>
      <button id="btnNuovoMondo" class="btn mini" data-i18n="labNuovoMondo" data-i18n-title="labNuovoMondoTitle"></button>
      <button id="btnRicomincia" class="btn mini" data-i18n="labRicomincia"></button>
      <button id="btnReimposta"  class="btn mini" data-i18n="labReimposta" data-i18n-title="labReimpostaTitle"></button>
    </div>

    <!-- Le due macchine. Su schermo stretto i riquadri diventano due schede:
         due terminali da 40 colonne non sono due terminali, sono due fessure. -->
    <div id="banco" class="banco">
      <div class="schede" id="schede" hidden>
        <button class="scheda on" data-host="pc">pc</button>
        <button class="scheda" data-host="server">server<span class="pallino" hidden></span></button>
      </div>

      <!-- Gli indirizzi NON sono scritti qui: li chiede la pagina alla macchina, e
           solo quando il mondo e' quello definitivo. Cambiano da un esercizio
           all'altro (il seme li rimescola, cosi' la risposta non e' copiabile), e
           un'etichetta che dice 10.10.0.1 mentre la macchina ne ha un altro sarebbe
           una bugia a video — proprio nel lab che insegna a non fidarsi delle
           etichette. Finche' non si sa, ci sono i puntini: un numero che cambia da
           solo dopo tre secondi sembra un guasto. -->
      <section class="host host-pc attivo" id="hostPc" data-host="pc">
        <header class="host-testa">
          <span class="host-pallino"></span>
          <span class="host-nome">pc</span>
          <span class="host-utente">manzolo</span>
          <span class="host-ip" id="ipPc">…</span>
          <span class="spazio"></span>
          <span class="host-ruolo" data-i18n="hostRuoloPc"></span>
        </header>
        <div class="host-schermo" id="terminalePc"></div>
      </section>

      <section class="host host-server" id="hostServer" data-host="server">
        <header class="host-testa">
          <span class="host-pallino"></span>
          <span class="host-nome">server</span>
          <span class="host-utente">deploy</span>
          <span class="host-ip" id="ipServer">…</span>
          <span class="spazio"></span>
          <span class="host-ruolo" data-i18n="hostRuoloServer"></span>
        </header>
        <div class="host-schermo" id="terminaleServer"></div>
      </section>
    </div>

    <div id="esercizi" class="esercizi"></div>
  </aside>
</main>

<footer class="piede">
  <button id="btnPrec" class="btn" data-i18n="capPrec"></button>
  <span id="etichettaCap" class="etichetta"></span>
  <button id="btnSucc" class="btn" data-i18n="capSucc"></button>
  <a id="linkSegnala" class="segnala" href="https://github.com/manzolo/SshLab/issues/new" target="_blank" rel="noopener" data-i18n="segnala" data-i18n-title="segnalaTitle"></a>
</footer>

<div id="velo" class="velo" hidden><div id="veloBox" class="velo-box"></div></div>

<script src="vendor/xterm/xterm.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
