name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contenuti:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: npm test

  # Il banco che avvia la macchina vera ed esegue tutti gli esercizi.
  # Dura qualche minuto: gira sui push a main, non su ogni bozza.
  esercizi:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '24' }
      - run: sudo apt-get update && sudo apt-get install -y zstd && pip install zstandard
      - run: make -C lab all
      - run: npm run test:labs
      - run: npm run test:regressione
